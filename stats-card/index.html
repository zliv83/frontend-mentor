<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" type="text/css" />
    <link rel="shortcut icon" href="data:," type="image/x-icon" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stats Card</title>
  </head>
  <body class="flex-center font-base">
    <section class="stats-card">
      <div
        class="image-container"
        role="img"
        aria-label="Three women collaborating at a work table"
      ></div>
      <div class="stats-container">
        <div class="description-group">
          <h1 class="text-1 text-white">
            Get <span class="text-purple">insights</span> that help grow your
            business.
          </h1>
          <p class="text-4 text-white-500">
            Discover the benefits of data analytics and make better decisions
            regarding revenue, customer experience, and overall efficiency.
          </p>
        </div>
        <ul class="stats-group">
          <li class="stat-item">
            <p class="stat text-white text-3">10K</p>
            <p class="stat-description text-white-600 text-5">Companies</p>
          </li>
          <li class="stat-item">
            <p class="stat text-white text-3">314</p>
            <p class="stat-description text-white-600 text-5">Templates</p>
          </li>
          <li class="stat-item">
            <p class="stat text-white text-3">12M+</p>
            <p class="stat-description text-white-600 text-5">Queries</p>
          </li>
        </ul>
      </div>
    </section>
  </body>
</html>
