<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor Solutions</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f0f0f0;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }

    header {
      max-width: 800px;
      margin: 0 auto 3rem;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: #555;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .card p {
      font-size: 0.9rem;
      color: #666;
    }

    .tag {
      display: inline-block;
      font-size: 0.75rem;
      background: #e8e8ff;
      color: #4a4a8a;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Frontend Mentor Solutions</h1>
    <p>My challenge solutions — built with HTML, CSS & JS</p>
  </header>

  <main class="grid">
    <!-- TODO: Add a card for each challenge -->
    <a class="card" href="/blog-preview-card/">
      <h2>Blog Preview Card</h2>
      <p>A responsive blog preview card component.</p>
      <span class="tag">Newbie</span>
    </a>
  </main>
</body>
</html>
